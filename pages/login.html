<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100">   
    <div class="shadow rounded-4 card-box position-relative">
        <a href="../index.html" class="text-secondary position-absolute top-0 start-0 m-3 fs-5" title="Volver al inicio">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h3 class="text-center fw-bold mb-4">Iniciar Sesión</h3>

        <form>
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" placeholder="email@ejemplo.com" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" placeholder="******" required>
                </div>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Entrar</button>
            </div>
        </form>

        <p class="text-center mt-3" style="font-size: 14px;">
            ¿No tienes cuenta?
            <a href="register.html">Regístrate</a>
        </p>
</body>
</html>
