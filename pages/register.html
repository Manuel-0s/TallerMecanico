<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">

</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="shadow rounded-4 card-box position-relative">
        <a href="../index.html" class="text-secondary position-absolute top-0 start-0 m-3 fs-5" title="Volver al inicio">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h3 class="text-center"><b>Crear cuenta</b></h3>

        <form>
            <div class="mb-3">
                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" placeholder="Nombre" required>
                        <input type="text" class="form-control" placeholder="Apellido (opcional)">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Teléfono</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                        <input type="tel" class="form-control" placeholder="Ej. 461 123 4567" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control" placeholder="email@ejemplo.com" required>
                    </div>
                </div>
               
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" placeholder="Crea una contraseña" required>
                    </div>
                </div>
 
                <div class="mb-3">
                    <label class="form-label">Repite la contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" placeholder="confirmar constraseña" required>
                    </div>
                </div>
               
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Registrate</button>
                </div>
            </div>
        </form>
        <p class="text-center mt-3" style="font-size: 14px;">
            ¿Ya tienes cuenta? 
            <a href="login.html">Iniciar sesión</a>
        </p>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
