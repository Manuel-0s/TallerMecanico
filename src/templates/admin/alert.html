<?php if (isset($alerta['mensaje']) && isset($alerta['tipo'])): ?>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: '<?= $alerta['tipo'] === 'danger' ? 'error' : htmlspecialchars($alerta['tipo']); ?>',
            title: <?= json_encode($alerta['mensaje']); ?>,
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true
        });
    });
</script>
<?php endif; ?>
